<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellsiam</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Arkaplan Müzik (Gizli Oynatıcı) -->
    <audio id="bg-music" loop preload="auto">
        <source src="./assets/music.mp3" type="audio/mpeg">
    </audio>

    <!-- Müzik Kontrol Butonu -->
    <button id="music-toggle" class="music-btn" title="Müziği Başlat/Durdur">
        <i class="fa-solid fa-music"></i>
    </button>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Wellsiam</h1>
            <p>Hoş Geldiniz</p>
            <a href="#gallery" class="btn">Galeriye Göz At</a>
        </div>
    </section>

    <!-- GALERİ SECTION -->
    <section id="gallery" class="gallery-section">
        <h2>Fotoğraf Galerisi</h2>
        <div class="gallery-grid">
            <div class="card"><img src="./assets/photo1.jpg" alt="Fotoğraf 1" loading="lazy"></div>
            <div class="card"><img src="./assets/photo2.jpg" alt="Fotoğraf 2" loading="lazy"></div>
            <div class="card"><img src="./assets/photo3.jpg" alt="Fotoğraf 3" loading="lazy"></div>
            <div class="card"><img src="./assets/photo4.jpg" alt="Fotoğraf 4" loading="lazy"></div>
            <div class="card"><img src="./assets/photo5.jpg" alt="Fotoğraf 5" loading="lazy"></div>
            <div class="card"><img src="./assets/photo6.jpg" alt="Fotoğraf 6" loading="lazy"></div>
            <div class="card"><img src="./assets/photo7.jpg" alt="Fotoğraf 7" loading="lazy"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Wellsiam - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Script JS -->
    <script src="script.js"></script>
</body>
</html>
